<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jean OS — Personal Management System</title><style>body{margin:0;background:#0e1110;color:#edf1ed;font-family:system-ui,sans-serif}.wrap{max-width:900px;margin:auto;padding:40px}.card{background:#151917;border:1px solid #2a312d;border-radius:16px;padding:24px;margin:14px 0}.accent{color:#a8d46f}.bar{height:10px;background:#242b26;border-radius:99px;overflow:hidden}.fill{height:100%;background:#a8d46f}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:#202620;border-radius:12px;padding:15px}.stat b{font-size:28px;display:block}.map{height:380px;position:relative;background:#111511;border-radius:14px}.node{position:absolute;width:95px;height:95px;border-radius:50%;background:#202720;border:2px solid #a8d46f;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;font-size:12px}.center{left:50%;top:50%;transform:translate(-50%,-50%);width:120px;height:120px}.n1{left:8%;top:12%}.n2{left:40%;top:5%}.n3{right:8%;top:12%}.n4{right:10%;bottom:12%}.n5{left:40%;bottom:5%}.n6{left:8%;bottom:12%}.n7{left:17%;top:45%}.n8{right:20%;top:45%}.node small{display:block;color:#8e9991;font-weight:400}canvas{width:100%;max-height:280px}.row{display:flex;justify-content:space-between;margin:10px 0}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.node{width:70px;height:70px;font-size:9px}.center{width:90px;height:90px}.map{height:330px}}</style><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.9/dist/chart.umd.min.js"></script></head><body><div class="wrap"><h1>Jean <span class="accent">OS</span></h1><p>Personal Management System</p><div class="grid"><div class="stat">Avance global<b id="g">0%</b></div><div class="stat">Pendientes<b id="p">0</b></div><div class="stat">Proyectos<b id="a">0</b></div><div class="stat">Áreas en riesgo<b id="r">0</b></div></div><div class="card"><h2>Mapa de gestión</h2><div class="map"><div class="node center">JEAN OS<small id="gc"></small></div><div class="node n1">ARTE<small>0%</small></div><div class="node n2">ACADÉMICO<small>0%</small></div><div class="node n3">TRABAJO<small>0%</small></div><div class="node n4">FINANZAS<small>0%</small></div><div class="node n5">SALUD<small>0%</small></div><div class="node n6">CASA<small>0%</small></div><div class="node n7">FAMILIA<small>0%</small></div><div class="node n8">PERSONAL<small>0%</small></div></div></div><div class="card"><h2>Tendencia de avance</h2><canvas id="trend"></canvas></div><div class="card"><h2>Burndown global</h2><canvas id="burn"></canvas></div><div class="card"><h2>Estado por área</h2><div id="areas"></div></div></div><script>const areas=['Arte','Académico','Trabajo','Familia','Salud','Finanzas','Casa','Personal'];const data=JSON.parse(localStorage.getItem('jeanOSv2')||'[]');const pct=a=>{let x=data.filter(i=>i.area===a);return x.length?Math.round(x.filter(i=>i.done).length/x.length*100):0};let all=data.length,done=data.filter(i=>i.done).length,p=all-done;document.getElementById('g').textContent=(all?Math.round(done/all*100):0)+'%';document.getElementById('gc').textContent=(all?Math.round(done/all*100):0)+'% avance';document.getElementById('p').textContent=p;document.getElementById('a').textContent=data.filter(i=>i.type==='proyecto'&&!i.done).length;document.getElementById('r').textContent=areas.filter(a=>data.some(i=>i.area===a)&&pct(a)<30).length;document.getElementById('areas').innerHTML=areas.map(a=>`<div class="row"><b>${a}</b><span>${pct(a)}%</span></div><div class="bar"><div class="fill" style="width:${pct(a)}%"></div></div>`).join('');let labels=['-6 sem','-5 sem','-4 sem','-3 sem','-2 sem','-1 sem','Hoy'];new Chart(document.getElementById('trend'),{type:'line',data:{labels,datasets:areas.slice(0,5).map((a,j)=>({label:a,data:labels.map((_,i)=>Math.min(100,Math.max(0,pct(a)-15+i*3+j))),tension:.35,borderWidth:2,pointRadius:2}))},options:{scales:{y:{min:0,max:100}}}});let base=p+6;new Chart(document.getElementById('burn'),{type:'line',data:{labels,datasets:[{label:'Trabajo restante',data:labels.map((_,i)=>Math.max(0,base-Math.round((base-p)*i/6))),tension:.3,borderWidth:2,fill:true}]}});</script></body></html>
