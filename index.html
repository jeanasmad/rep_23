<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jean OS — Icosaedro</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080a09;color:#edf1ed;font-family:system-ui,sans-serif}canvas{display:block;width:100%;height:100%}.ui{position:absolute;inset:0;pointer-events:none}.brand{position:absolute;left:28px;top:24px;font-size:20px;font-weight:800}.brand span{color:#a8d46f}.hint{position:absolute;left:28px;bottom:24px;color:#768078;font-size:12px}.panel{position:absolute;right:25px;top:25px;width:260px;padding:18px;background:#111512dd;border:1px solid #283029;border-radius:14px;backdrop-filter:blur(15px)}.panel h1{font-size:16px;margin:0 0 5px}.panel p{font-size:12px;color:#879188}.row{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid #242b26;font-size:12px}.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:8px}</style></head><body><canvas id="c"></canvas><div class="ui"><div class="brand">JEAN <span>OS</span> · ICOSAEDRO</div><div class="panel"><h1>Personal Visual Universe</h1><p>Cada cara representa un dominio de vida.</p><div id="rows"></div></div><div class="hint">Arrastre para rotar · rueda para zoom · doble clic para centrar</div></div><script>const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');const areas=[['Arte',72],['Académico',64],['Trabajo',58],['Familia',81],['Salud',46],['Finanzas',39],['Casa',71],['Personal',55]],colors=['#a8d46f','#8dc9b1','#d7bf69','#c98f83','#9ca8d8','#c19bd8','#8eb6c7','#d9a878'];document.getElementById('rows').innerHTML=areas.map((a,i)=>'<div class="row"><span><i class="dot" style="background:'+colors[i]+'"></i>'+a[0]+'</span><b>'+a[1]+'%</b></div>').join('');let W,H,dpr,rx=-.45,ry=.65,zoom=1,drag=false,lx=0,ly=0;function resize(){dpr=devicePixelRatio||1;W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}resize();addEventListener('resize',resize);const phi=(1+Math.sqrt(5))/2,raw=[[-1,phi,0],[1,phi,0],[-1,-phi,0],[1,-phi,0],[0,-1,phi],[0,1,phi],[0,-1,-phi],[0,1,-phi],[phi,0,-1],[phi,0,1],[-phi,0,-1],[-phi,0,1]],verts=raw.map(v=>{let n=Math.hypot(...v);return v.map(x=>x/n)}),faces=[];for(let a=0;a<12;a++)for(let b=a+1;b<12;b++)for(let c=b+1;c<12;c++){let ds=[[a,b],[a,c],[b,c]].map(([i,j])=>Math.hypot(...verts[i].map((x,k)=>x-verts[j][k])));if(ds.every(d=>d<1.11))faces.push([a,b,c])}function rot(v){let[x,y,z]=v,cy=Math.cos(ry),sy=Math.sin(ry),cx=Math.cos(rx),sx=Math.sin(rx),X=x*cy-z*sy,Z=x*sy+z*cy,Y=y*cx-Z*sx;return[X,Y,Z]}function proj(v){let s=Math.min(W,H)*.34*zoom,z=v[2]+2.8;return[W/2+v[0]*s/z,H/2+v[1]*s/z,z]}function draw(){if(!drag)ry+=.0025;ctx.clearRect(0,0,W,H);let r=verts.map(rot),p=r.map(proj);faces.map((f,i)=>({f,z:f.reduce((s,j)=>s+r[j][2],0)/3,i})).sort((a,b)=>a.z-b.z).forEach(o=>{let q=o.f.map(j=>p[j]),col=colors[o.i%colors.length];ctx.beginPath();ctx.moveTo(q[0][0],q[0][1]);q.slice(1).forEach(v=>ctx.lineTo(v[0],v[1]));ctx.closePath();ctx.fillStyle=col+'16';ctx.fill();ctx.strokeStyle=col+'99';ctx.lineWidth=1.2;ctx.stroke()});requestAnimationFrame(draw)}draw();canvas.onpointerdown=e=>{drag=true;lx=e.clientX;ly=e.clientY;canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(!drag)return;ry+=(e.clientX-lx)*.008;rx+=(e.clientY-ly)*.008;rx=Math.max(-1.4,Math.min(1.4,rx));lx=e.clientX;ly=e.clientY};canvas.onpointerup=()=>drag=false;canvas.onwheel=e=>{e.preventDefault();zoom*=e.deltaY<0?1.08:.93;zoom=Math.max(.55,Math.min(2.2,zoom))};canvas.ondblclick=()=>{rx=-.45;ry=.65;zoom=1}</script></body></html>
