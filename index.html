<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ORBIT — Eisenhower Kanban</title>
<meta name="description" content="Eisenhower backlog, Kanban y burndown semanal basado en esfuerzo.">
<style>
:root{--bg:#0d0e13;--panel:#151720;--text:#f4f3ee;--muted:#9b9cab;--line:#30323d;--accent:#9b7cff;--q1:#dcd3ff;--q2:#cdeec5;--q3:#fff0a8;--q4:#ffab9b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0%,#252039 0,#0d0e13 35%),var(--bg);color:var(--text);font:14px/1.35 Inter,ui-sans-serif,system-ui,-apple-system,sans-serif}.app{max-width:1500px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:24px}.brand{display:flex;gap:14px;align-items:center}.orb{width:42px;height:42px;border:1px solid #fff5;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#b49cff 18%,#6248c9 55%,#171326 70%);box-shadow:0 0 35px #896cff55}.eyebrow{font-size:11px;letter-spacing:.18em;color:#aaa6bb;text-transform:uppercase}.title{font-size:28px;font-weight:750;letter-spacing:-.04em}.actions{display:flex;gap:8px}.btn{border:1px solid var(--line);background:#191b24;color:var(--text);padding:9px 13px;border-radius:10px}.btn:hover{border-color:#625a7f}.btn.primary{background:var(--accent);border-color:var(--accent);color:#100d19;font-weight:700}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}.stat{background:#12141c;border:1px solid var(--line);border-radius:14px;padding:14px}.stat b{font-size:24px}.stat span{display:block;color:var(--muted);font-size:12px;margin-top:3px}.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px}.tab{background:none;border:0;color:var(--muted);padding:11px 14px;border-bottom:2px solid transparent}.tab.active{color:#fff;border-color:var(--accent)}.view{display:none}.view.active{display:block}.matrix{display:grid;grid-template-columns:1fr 1fr;gap:12px}.quadrant{min-height:330px;border:1px solid #252734;border-radius:16px;overflow:hidden;background:#12141a}.qhead{padding:17px 18px;color:#111;min-height:84px}.qhead strong{display:block;font-size:17px}.qhead small{opacity:.72}.q1 .qhead{background:var(--q1)}.q2 .qhead{background:var(--q2)}.q3 .qhead{background:var(--q3)}.q4 .qhead{background:var(--q4)}.cards{padding:14px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:9px;min-height:240px}.card{background:#1c1e28;border:1px solid #343642;border-radius:10px;padding:11px 12px;min-width:170px;max-width:250px;flex:1 1 180px}.card:hover{border-color:#70678c}.card-title{font-weight:650;margin-bottom:8px}.meta{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--muted);font-size:11px}.badge{border-radius:999px;padding:3px 7px;background:#2b2e3a;color:#ddd}.weight{color:#d5c9ff}.kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;overflow:auto}.column{background:#11131a;border:1px solid var(--line);border-radius:14px;min-height:560px}.colhead{padding:13px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.dropzone{padding:10px;min-height:500px}.dropzone.dragover{background:#1b1930}.kcard{background:#1a1c25;border:1px solid #30323e;border-radius:10px;padding:12px;margin-bottom:9px}.kcard[draggable=true]{cursor:grab}.kcard.dragging{opacity:.35}.kcard .card-title{font-size:13px}.burndown{background:#11131a;border:1px solid var(--line);border-radius:16px;padding:18px}.chart-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.chart-head h2{margin:0;font-size:18px}.chart-wrap{height:410px}.chart-wrap svg{width:100%;height:100%;display:block}.legend{display:flex;gap:18px;color:var(--muted);font-size:12px;margin-top:10px}.legend i{display:inline-block;width:18px;border-top:2px solid currentColor;margin-right:5px;vertical-align:middle}.legend .ideal{color:#8c8997}.legend .ideal i{border-top-style:dashed}.legend .real{color:#b49cff}.empty{color:#666a78;padding:35px 10px;text-align:center;width:100%}.modal{position:fixed;inset:0;background:#0009;display:none;place-items:center;padding:20px;z-index:10}.modal.open{display:grid}.dialog{width:min(560px,100%);background:#171922;border:1px solid #3a3c49;border-radius:18px;padding:20px}.dialog h2{margin:0 0 17px}.form{display:grid;gap:12px}.form label{display:grid;gap:6px;color:#b7b6c0;font-size:12px}.form input,.form select,.form textarea{background:#10121a;border:1px solid #343642;color:#fff;border-radius:9px;padding:10px}.form textarea{min-height:70px;resize:vertical}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:17px}.toast{position:fixed;right:20px;bottom:20px;background:#f4f3ee;color:#111;padding:11px 14px;border-radius:10px;display:none}@media(max-width:900px){.matrix,.kanban{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.top{align-items:flex-start;flex-direction:column}.column{min-height:250px}.dropzone{min-height:180px}}@media(max-width:560px){.app{padding:15px}.grid2{grid-template-columns:1fr}.card{min-width:145px}}
</style>
</head>
<body><div class="app">
<header class="top"><div class="brand"><div class="orb"></div><div><div class="eyebrow">Project ORBIT</div><div class="title">Eisenhower / Kanban</div></div></div><div class="actions"><button class="btn" id="reset">Restaurar datos</button><button class="btn primary" id="add">+ Nueva tarea</button></div></header>
<section class="stats"><div class="stat"><b id="sTasks">0</b><span>tareas activas</span></div><div class="stat"><b id="sPoints">0</b><span>puntos pendientes</span></div><div class="stat"><b id="sDone">0</b><span>puntos completados esta semana</span></div><div class="stat"><b id="sRate">0%</b><span>avance semanal</span></div></section>
<nav class="tabs"><button class="tab active" data-view="matrix">Eisenhower</button><button class="tab" data-view="kanban">Kanban</button><button class="tab" data-view="burndown">Burndown</button></nav>
<main><section class="view active" id="matrix"><div class="matrix" id="matrixGrid"></div></section><section class="view" id="kanban"><div class="kanban" id="kanbanGrid"></div></section><section class="view" id="burndown"><div class="burndown"><div class="chart-head"><h2>Burndown semanal</h2><span id="weekLabel" class="badge"></span></div><div class="chart-wrap"><svg id="chart" viewBox="0 0 1000 400" preserveAspectRatio="none"></svg></div><div class="legend"><span class="ideal"><i></i>ideal</span><span class="real"><i></i>real</span></div></div></section></main></div>
<div class="modal" id="modal"><div class="dialog"><h2 id="modalTitle">Nueva tarea</h2><form class="form" id="form"><label>Tarea<input id="fTitle" required maxlength="120"></label><label>Descripción<textarea id="fDesc"></textarea></label><div class="grid2"><label>Cuadrante<select id="fQuad"><option value="q1">Alto impacto · bajo esfuerzo</option><option value="q2">Alto impacto · alto esfuerzo</option><option value="q3">Bajo impacto · bajo esfuerzo</option><option value="q4">Bajo impacto · alto esfuerzo</option></select></label><label>Estimación (horas)<input id="fHours" type="number" min="0.25" step="0.25" value="1"></label></div><div class="grid2"><label>Estado<select id="fStatus"><option value="backlog">Backlog</option><option value="todo">To Do</option><option value="doing">In Progress</option><option value="done">Done</option></select></label><label>Peso automático<input id="fWeight" readonly></label></div><div class="dialog-actions"><button type="button" class="btn" id="cancel">Cancelar</button><button class="btn primary">Guardar</button></div></form></div></div><div class="toast" id="toast"></div>
<script>
const KEY='orbit.tasks.v1',QUADS={q1:{name:'Alto impacto + bajo esfuerzo',sub:'Ganancias rápidas'},q2:{name:'Alto impacto + alto esfuerzo',sub:'Proyectos estratégicos'},q3:{name:'Bajo impacto + bajo esfuerzo',sub:'Mantenimiento y ocio'},q4:{name:'Bajo impacto + alto esfuerzo',sub:'Eliminar, delegar o simplificar'}},STATUSES={backlog:'Backlog',todo:'To Do',doing:'In Progress',done:'Done'};
const raw={q1:['Estructura de videollamadas familiares','Listar Pasatiempos','Cambiar Dirección Fiscal','Actualizar diario','Cambio de DNI','Configurar Alarmas','Hacer calendario físico','Curso de marketing','Alistar Gym','Requisitos para título','Cronograma de estudios','Visitar Museos','Hacer Reels de esculturas'],q2:['Curso de MindJourney 2','Proyecto Apple Music','Curso de matemática','Curso Especialización Coursera','Proyecto Canal de YouTube','Dibujo matrimonio','Escultura Bulbasaur Garlic','Curso Doméstica','Proyectos de fieltro','Novela sobre un horno crematorio ilegal','Dibujo Embarazada','Dibujo de la bb','Efecto Piscina en Resina','Shopify','Forms para servicios','Postular a trabajos'],q3:['Poner nuevos pasadores','Keke de Kinua','Comprar bicicleta','Renovar brevete','Comprar repuesto de postit','Comprar Libros en Amazon','Ordenar Workspace en Mac','Diseño de infusonera','Diseño de Tetera','Reparar escultura de mano','Organizar musas'],q4:['Escultura Perrito','Escultura Cabeza','Coser botones','Costura de miniaturas','Escultura Porta PaloSanto','Cerámica ojos']};
const seedHours={'Actualizar diario':.25,'Listar Pasatiempos':.5,'Configurar Alarmas':.5,'Hacer calendario físico':1,'Visitar Museos':2,'Alistar Gym':1,'Poner nuevos pasadores':.5,'Keke de Kinua':2,'Comprar bicicleta':1,'Renovar brevete':1,'Comprar repuesto de postit':.5,'Comprar Libros en Amazon':.5,'Ordenar Workspace en Mac':1,'Coser botones':1,'Costura de miniaturas':2,'Organizar musas':1};
const effortToPoints=h=>h<=.5?1:h<=1?2:h<=2?3:h<=4?5:h<=8?8:13,pointsFor=h=>effortToPoints(Number(h)||0),id=()=>crypto.randomUUID();
function initial(){let a=[];Object.entries(raw).forEach(([q,names])=>names.forEach((title,i)=>{let hours=seedHours[title]??({q1:1,q2:4,q3:1,q4:3}[q]);a.push({id:id(),title,desc:'',quad:q,hours,status:'backlog',weight:pointsFor(hours),createdAt:Date.now()+i,doneAt:null,events:[]})}));return a}
let tasks=JSON.parse(localStorage.getItem(KEY)||'null')||initial();save();function save(){localStorage.setItem(KEY,JSON.stringify(tasks))}function weekStart(d=new Date()){d=new Date(d);d.setHours(0,0,0,0);let day=d.getDay();d.setDate(d.getDate()+(day===0?-6:1-day));return d}function isoDate(d){return new Date(d).toISOString().slice(0,10)}
function render(){renderStats();renderMatrix();renderKanban();renderChart()}function renderStats(){let s=weekStart(),e=new Date(s);e.setDate(e.getDate()+7),total=tasks.reduce((a,t)=>a+t.weight,0),pending=tasks.filter(t=>t.status!=='done').reduce((a,t)=>a+t.weight,0),done=tasks.filter(t=>t.doneAt&&new Date(t.doneAt)>=s&&new Date(t.doneAt)<e).reduce((a,t)=>a+t.weight,0);document.querySelector('#sTasks').textContent=tasks.filter(t=>t.status!=='done').length;document.querySelector('#sPoints').textContent=pending;document.querySelector('#sDone').textContent=done;document.querySelector('#sRate').textContent=(total?Math.round(done/total*100):0)+'%'}
function esc(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function card(t){return `<article class="card" draggable="true" data-id="${t.id}"><div class="card-title">${esc(t.title)}</div><div class="meta"><span>${t.hours}h · <b class="weight">${t.weight} pt</b></span><span class="badge">${STATUSES[t.status]}</span></div></article>`}
function renderMatrix(){let el=document.querySelector('#matrixGrid');el.innerHTML='';Object.keys(QUADS).forEach(q=>{let box=document.createElement('div');box.className='quadrant '+q;box.innerHTML=`<div class="qhead"><strong>${QUADS[q].name}</strong><small>${QUADS[q].sub}</small></div><div class="cards" data-quad="${q}"></div>`;el.append(box);let c=box.querySelector('.cards');tasks.filter(t=>t.quad===q).forEach(t=>c.insertAdjacentHTML('beforeend',card(t)));c.addEventListener('dragover',e=>e.preventDefault());c.addEventListener('drop',e=>moveTask(e.dataTransfer.getData('text/plain'),{quad:q}))});bindDrag()}
function renderKanban(){let el=document.querySelector('#kanbanGrid');el.innerHTML='';Object.entries(STATUSES).forEach(([s,n])=>{let col=document.createElement('div');col.className='column';col.innerHTML=`<div class="colhead"><b>${n}</b><span class="badge">${tasks.filter(t=>t.status===s).length}</span></div><div class="dropzone" data-status="${s}"></div>`;el.append(col);let dz=col.querySelector('.dropzone');tasks.filter(t=>t.status===s).forEach(t=>dz.insertAdjacentHTML('beforeend',`<article class="kcard" draggable="true" data-id="${t.id}"><div class="card-title">${esc(t.title)}</div><div class="meta"><span>${t.hours}h · <b class="weight">${t.weight} pt</b></span><span>${QUADS[t.quad].name.split(' + ')[0]}</span></div></article>`));dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('dragover')});dz.addEventListener('dragleave',()=>dz.classList.remove('dragover'));dz.addEventListener('drop',e=>{e.preventDefault();dz.classList.remove('dragover');moveTask(e.dataTransfer.getData('text/plain'),{status:s})})});bindDrag()}
function bindDrag(){document.querySelectorAll('[draggable=true]').forEach(x=>{x.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',x.dataset.id);x.classList.add('dragging')});x.addEventListener('dragend',()=>x.classList.remove('dragging'));x.addEventListener('dblclick',()=>openEdit(x.dataset.id))})}
function moveTask(tid,patch){let t=tasks.find(x=>x.id===tid);if(!t)return;let was=t.status;Object.assign(t,patch);if(patch.status==='done'&&was!=='done'){t.doneAt=Date.now();t.events=t.events||[];t.events.push({date:isoDate(new Date()),points:t.weight})}if(patch.status&&patch.status!=='done'&&was==='done')t.doneAt=null;save();render();toast('Tarea actualizada')}
function openEdit(tid=null){let t=tid?tasks.find(x=>x.id===tid):null;document.querySelector('#modalTitle').textContent=t?'Editar tarea':'Nueva tarea';document.querySelector('#fTitle').value=t?.title||'';document.querySelector('#fDesc').value=t?.desc||'';document.querySelector('#fQuad').value=t?.quad||'q1';document.querySelector('#fHours').value=t?.hours||1;document.querySelector('#fStatus').value=t?.status||'backlog';document.querySelector('#fWeight').value=pointsFor(t?.hours||1)+' pt';document.querySelector('#modal').classList.add('open');document.querySelector('#form').dataset.id=t?.id||''}function close(){document.querySelector('#modal').classList.remove('open')}
function renderChart(){let s=weekStart(),dates=Array.from({length:8},(_,i)=>{let d=new Date(s);d.setDate(d.getDate()+i);return d}),initialPoints=tasks.reduce((a,t)=>a+t.weight,0),doneByDay=dates.map(d=>tasks.filter(t=>t.doneAt&&isoDate(t.doneAt)===isoDate(d)).reduce((a,t)=>a+t.weight,0));let c=0,real=dates.map((_,i)=>{c+=doneByDay[i];return Math.max(0,initialPoints-c)}),ideal=dates.map((_,i)=>initialPoints-initialPoints*i/7),W=1000,H=400,p={l:58,r:22,t:25,b:48},max=Math.max(initialPoints,1),x=i=>p.l+(W-p.l-p.r)*i/7,y=v=>p.t+(H-p.t-p.b)*(1-v/max),poly=a=>a.map((v,i)=>`${x(i)},${y(v)}`).join(' ');let svg=`<line x1="${p.l}" y1="${H-p.b}" x2="${W-p.r}" y2="${H-p.b}" stroke="#343642"/><line x1="${p.l}" y1="${p.t}" x2="${p.l}" y2="${H-p.b}" stroke="#343642"/><polyline points="${poly(ideal)}" fill="none" stroke="#777582" stroke-width="2" stroke-dasharray="8 7"/><polyline points="${poly(real)}" fill="none" stroke="#b49cff" stroke-width="4"/>`;for(let i=0;i<8;i++)svg+=`<line x1="${x(i)}" y1="${H-p.b}" x2="${x(i)}" y2="${H-p.b+5}" stroke="#555766"/><text x="${x(i)}" y="${H-18}" fill="#888a96" text-anchor="middle" font-size="11">${dates[i].toLocaleDateString('es-PE',{weekday:'short',day:'2-digit'})}</text>`;for(let j=0;j<=4;j++){let v=Math.round(max*j/4);svg+=`<line x1="${p.l-4}" y1="${y(v)}" x2="${W-p.r}" y2="${y(v)}" stroke="#22242e"/><text x="${p.l-10}" y="${y(v)+4}" fill="#777986" text-anchor="end" font-size="11">${v}</text>`}svg+=`<text x="${W-p.r}" y="${p.t+12}" fill="#8c8997" text-anchor="end" font-size="11">${initialPoints} pt iniciales</text>`;document.querySelector('#chart').innerHTML=svg;document.querySelector('#weekLabel').textContent=`${isoDate(s)} → ${isoDate(dates[7])}`}
function toast(s){let x=document.querySelector('#toast');x.textContent=s;x.style.display='block';clearTimeout(window.__toast);window.__toast=setTimeout(()=>x.style.display='none',1800)}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelector('#'+b.dataset.view).classList.add('active');render()}));document.querySelector('#add').onclick=()=>openEdit();document.querySelector('#cancel').onclick=close;document.querySelector('#fHours').oninput=e=>document.querySelector('#fWeight').value=pointsFor(e.target.value)+' pt';document.querySelector('#modal').onclick=e=>{if(e.target.id==='modal')close()};
document.querySelector('#form').onsubmit=e=>{e.preventDefault();let f=e.currentTarget,tid=f.dataset.id,t=tid?tasks.find(x=>x.id===tid):{id:id(),createdAt:Date.now(),events:[]},was=t.status;t.title=document.querySelector('#fTitle').value.trim();t.desc=document.querySelector('#fDesc').value;t.quad=document.querySelector('#fQuad').value;t.hours=Number(document.querySelector('#fHours').value);t.weight=pointsFor(t.hours);t.status=document.querySelector('#fStatus').value;if(t.status==='done'&&was!=='done'){t.doneAt=Date.now();t.events.push({date:isoDate(new Date()),points:t.weight})}else if(t.status!=='done')t.doneAt=null;if(!tid)tasks.push(t);save();close();render();toast('Guardado')};document.querySelector('#reset').onclick=()=>{if(confirm('Esto reemplazará sus cambios locales por las tareas iniciales. ¿Continuar?')){tasks=initial();save();render();toast('Datos restaurados')}};render();
</script></body></html>
